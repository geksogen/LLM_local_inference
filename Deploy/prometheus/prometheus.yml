global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Метрики шлюза LiteLLM (токены, квоты, ошибки, задержки)
  - job_name: 'litellm-proxy'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['litellm:4000'] 

  # Метрики Docker Engine (потребление RAM/CPU контейнерами)
  - job_name: 'docker-engine'
    static_configs:
      - targets: ['host.docker.internal:9323'] # Требует настройки daemon.json на Ubuntu

  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]
